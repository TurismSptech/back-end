<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TourWise | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="icon" href="./assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="auth-nav" aria-label="Navegação principal">
        <a class="auth-brand" href="index.html" aria-label="TourWise - página inicial">
            <span>Tour</span>Wise
        </a>
        <div class="auth-nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#solucoes">Soluções</a>
            <a href="index.html#sobre-nos">Sobre nós</a>
            <a href="index.html#como-funciona">Como funciona</a>
            <a href="index.html#contato">Contato</a>
        </div>
        <a class="auth-nav-action" href="cadastro.html">Cadastro</a>
    </nav>

    <main class="auth-main">
        <section class="auth-panel" aria-labelledby="auth-title">
            <p class="auth-eyebrow">Bem-vindo ao TourWise</p>
            <h1 id="auth-title">Login do agente</h1>
            <p class="auth-description">Acesse sua conta para acompanhar informações e oportunidades do setor turístico.</p>

            <div class="auth-message" id="cardErro" role="status" aria-live="polite">
                <span id="mensagem_erro"></span>
            </div>

            <form class="auth-form" onsubmit="return entrar()">
                <label for="email_input">E-mail</label>
                <input id="email_input" type="email" maxlength="45" placeholder="seuemail@agencia.com" autocomplete="username" required>

                <label for="senha_input">Senha</label>
                <input id="senha_input" type="password" maxlength="45" placeholder="Digite sua senha" autocomplete="current-password" required>

                <button class="auth-submit" type="submit">Entrar como agente</button>
            </form>

            <div id="div_aguardar" class="auth-loading" aria-live="polite">
                <img src="./assets/circle-loading.gif" id="loading-gif" alt="Carregando">
            </div>
            <div id="div_erros_login"></div>
            <p class="auth-switch">Ainda não tem acesso? <a href="cadastro.html">Cadastre sua conta</a></p>
        </section>
    </main>

    <footer class="auth-footer">TourWise · Inteligência para o turismo</footer>

</body>

</html>

<script>


    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.textContent = "Preencha seu e-mail e sua senha.";
            finalizarAguardar();
            return false;
        }

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(json => {
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.email;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.CARGO_USUARIO = json.cargo;
                    sessionStorage.ID_AGENCIA = json.agenciaId;
                    sessionStorage.AQUARIOS = JSON.stringify([]);

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                resposta.text().then(texto => {
                    cardErro.style.display = "block";
                    mensagem_erro.textContent = texto;
                    finalizarAguardar();
                });
            }

        }).catch(function (erro) {
            cardErro.style.display = "block";
            mensagem_erro.textContent = "Não foi possível conectar ao servidor.";
            finalizarAguardar();
        })

        return false;
    }

</script>
