<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TourWise | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/auth.css" />
  <link rel="icon" href="./assets/icon/favicon2.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>

<body onload="listarAgencias()">
  <nav class="auth-nav" aria-label="Navegação principal">
    <a class="auth-brand" href="index.html" aria-label="TourWise - página inicial">
      <span>Tour</span>Wise
    </a>
    <div class="auth-nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#solucoes">Soluções</a>
      <a href="index.html#sobre-nos">Sobre nós</a>
      <a href="index.html#como-funciona">Como funciona</a>
      <a href="index.html#contato">Contato</a>
    </div>
    <a class="auth-nav-action" href="login.html">Login</a>
  </nav>

  <main class="auth-main">
    <section class="auth-panel auth-panel-register" aria-labelledby="auth-title">
      <p class="auth-eyebrow">Comece a usar o TourWise</p>
      <h1 id="auth-title">Cadastro de agente</h1>
      <p class="auth-description">Crie seu acesso e conecte-se à sua agência.</p>

      <div class="auth-message" id="cardErro" role="status" aria-live="polite">
        <span id="mensagem_erro"></span>
      </div>

      <form class="auth-form" onsubmit="return cadastrar()">
        <label for="agencia_input">Agência</label>
        <select id="agencia_input" required>
          <option value="">Selecione sua agência</option>
        </select>

        <label for="email_input">E-mail</label>
        <input id="email_input" type="email" maxlength="45" placeholder="seuemail@agencia.com" autocomplete="email" required />

        <label for="senha_input">Senha</label>
        <input id="senha_input" type="password" maxlength="45" placeholder="Crie uma senha" autocomplete="new-password" required />

        <label for="confirmacao_senha_input">Confirme sua senha</label>
        <input id="confirmacao_senha_input" type="password" maxlength="45" placeholder="Digite a senha novamente" autocomplete="new-password" required />

        <button class="auth-submit" type="submit">Cadastrar como agente</button>
      </form>

      <div id="div_aguardar" class="auth-loading" aria-live="polite">
        <img src="./assets/circle-loading.gif" id="loading-gif" alt="Carregando" />
      </div>
      <div id="div_erros_login"></div>
      <p class="auth-switch">Já tem acesso? <a href="login.html">Entrar na plataforma</a></p>
    </section>
  </main>

  <footer class="auth-footer">TourWise · Inteligência para o turismo</footer>
</body>

</html>

<script>

  function cadastrar() {
    var emailVar = email_input.value.trim();
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var agenciaVar = agencia_input.value;

    if (!emailVar || !senhaVar || !confirmacaoSenhaVar || !agenciaVar) {
      mostrarErro("Preencha todos os campos.");
      return false;
    }

    if (senhaVar !== confirmacaoSenhaVar) {
      mostrarErro("As senhas não coincidem.");
      return false;
    }

    aguardar();
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        emailServer: emailVar,
        senhaServer: senhaVar,
        idAgenciaServer: agenciaVar
      }),
    })
      .then(function (resposta) {
        if (!resposta.ok) {
          return resposta.text().then(function (mensagem) {
            throw new Error(mensagem || "Houve um erro ao realizar o cadastro.");
          });
        }
        cardErro.style.display = "block";
        mensagem_erro.textContent = "Cadastro realizado com sucesso! Redirecionando para tela de Login...";
        setTimeout(function () {
          window.location = "login.html";
        }, 2000);
      })
      .catch(function (erro) {
        mostrarErro(erro.message);
      })
      .finally(function () {
        finalizarAguardar();
      });

    return false;
  }

  function listarAgencias() {
    fetch("/usuarios/agencias", {
      method: "GET",
    })
      .then(function (resposta) {
        if (!resposta.ok) {
          throw new Error("Não foi possível carregar as agências.");
        }
        return resposta.json();
      })
      .then(function (agencias) {
        agencias.forEach(function (agencia) {
          var opcao = document.createElement("option");
          opcao.value = agencia.id;
          opcao.textContent = agencia.nome;
          agencia_input.appendChild(opcao);
        });
      })
      .catch(function (erro) {
        mostrarErro(erro.message);
      });
  }

  function mostrarErro(mensagem) {
    cardErro.style.display = "block";
    mensagem_erro.textContent = mensagem;
    finalizarAguardar();
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
